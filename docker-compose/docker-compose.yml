name: party-song-guess
services:
  server:
    container_name: party-song-guess-server
    build: ../app/server
    ports:
      - "3000:3000"
    volumes:
      - ../app/server:/app/server
      # Keep the image's own node_modules: better-sqlite3 is a native module
      # compiled for Alpine, and the host copy would shadow it
      - /app/server/node_modules
      - catalog_data:/data
    environment:
      - CATALOG_DB_PATH=/data/catalog.db
    env_file:
      - .env
    command: node index.js

  client:
    container_name: party-song-guess-client
    build: ../app/client
    ports:
      - "5173:5173"
    volumes:
      - ../app/client:/app/client
      - /app/client/node_modules
    command: npm run dev
    depends_on:
      - server

volumes:
  # Keeps the song catalog across `docker compose down` / `up`
  catalog_data:
